name: Build Winter Bear Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web bundle
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Install Winter Bear Android Downloads bridge
        run: |
          mkdir -p android/app/src/main/java/com/asuncion/winterbearstudio
          cp android-template/MainActivity.java android/app/src/main/java/com/asuncion/winterbearstudio/MainActivity.java
          mkdir -p android/app/src/main/res
          cp -R android-template/res/. android/app/src/main/res/
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Winter-Bear-Studio-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
